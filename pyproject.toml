[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "llm-router"
version = "0.1.0"
description = "Send easy questions to a small model and hard ones to a large model, with a semantic cache in front and metrics to prove it saves cost without losing quality."
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [{ name = "Cenk Akin" }]
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
llm-router = "llm_router.cli:main"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
